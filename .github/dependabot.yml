# Dependabot: раз в неделю предлагает pull request'ы с обновлениями закреплённых версий —
# действий GitHub Actions (закреплены по хешу коммита) и образов Docker в compose.yaml и Dockerfile.
# Закрепление защищает от подмены тега, а Dependabot не даёт версиям устареть.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
