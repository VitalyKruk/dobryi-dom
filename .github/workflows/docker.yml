name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Линтер и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build # включает tsc -b
      - run: npm run test:api # интеграционные тесты API (node:test)

  docker:
    name: Образ Docker
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Раз в день пересобираем слой apk upgrade — исправления Alpine не застревают в кеше gha
      - name: Дата для обновления пакетов Alpine
        run: echo "APK_UPGRADE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Теги образа сайта
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Теги образа API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Имена совпадают с compose.yaml — стек поднимается из только что собранных образов
      - name: Сборка образа сайта
        uses: docker/build-push-action@v7
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          load: true
          tags: dobryi-dom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сборка образа API
        uses: docker/build-push-action@v7
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          target: api
          load: true
          tags: dobryi-dom-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke-тест стека (nginx → API)
        run: |
          docker compose up -d --no-build --wait web api
          B=http://localhost:8081
          curl -fs $B/healthz | grep -q ok
          # SPA-fallback: прямые ссылки должны отдавать index.html
          for path in / /catalog /pet/persik /admin/pets; do
            curl -fs "$B$path" | grep -q '<div id="root">' || { echo "FAIL $path"; exit 1; }
          done
          # Хешированные ассеты кешируются надолго
          asset=$(curl -fs $B/ | grep -o '/assets/[^"]*.js' | head -1)
          curl -fsI "$B$asset" | grep -qi 'cache-control: public, immutable'
          # API через nginx: данные, валидация, права, сохранение
          curl -fs "$B/api/pets?species=cat" | grep -q '"total"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/applications -H 'content-type: application/json' -d '{}')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/uploads -H 'content-type: image/png' --data-binary x)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/applications -H 'content-type: application/json'             -d '{"petId":"bublik","name":"CI Test","phone":"+7 (900) 000-00-00","email":"ci@example.com","city":"SPb","housing":"house","hasOtherPets":false,"experience":"some","preferredTime":"weekend"}')" = 201
          docker compose exec -T api grep -q ci@example.com /data/db.json

      - name: Логи контейнеров
        if: failure()
        run: docker compose logs web api

      - name: Вход в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа сайта
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Публикация образа API
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
