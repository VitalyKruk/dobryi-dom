name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Линтер и сборка
    runs-on: ubuntu-latest
    # Postgres для тех же тестов API на настоящей базе (npm run test:postgres)
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: dobryi_dom
          POSTGRES_USER: dobryi
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dobryi -d dobryi_dom"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build # включает tsc -b
      - run: npm run test:api # интеграционные тесты API (node:test)
      - run: npm run test:postgres # те же тесты на Postgres
        env:
          TEST_DATABASE_URL: postgres://dobryi:ci-only-password@127.0.0.1:5433/dobryi_dom_test

  docker:
    name: Образ Docker
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Раз в день пересобираем слой apk upgrade — исправления Alpine не застревают в кеше gha
      - name: Дата для обновления пакетов Alpine
        run: echo "APK_UPGRADE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Теги образа сайта
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Теги образа API
        id: meta-api
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Имена совпадают с compose.yaml — стек поднимается из только что собранных образов
      - name: Сборка образа сайта
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          load: true
          tags: dobryi-dom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Сборка образа API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          target: api
          load: true
          tags: dobryi-dom-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Smoke-тест стека (nginx → API → Postgres)
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose pull db
          docker compose up -d --no-build --wait web api
          B=http://localhost:8081
          curl -fs $B/healthz | grep -q ok
          # SPA-fallback: прямые ссылки должны отдавать index.html
          for path in / /catalog /pet/persik /admin/pets; do
            curl -fs "$B$path" | grep -q '<div id="root">' || { echo "FAIL $path"; exit 1; }
          done
          # Хешированные ассеты кешируются надолго
          asset=$(curl -fs $B/ | grep -o '/assets/[^"]*.js' | head -1)
          curl -fsI "$B$asset" | grep -qi 'cache-control: public, immutable'
          # Content-Security-Policy на страницах (nginx.conf): скрипты — только с нашего домена
          for path in / /pet/persik; do
            curl -fsI "$B$path" | grep -qi "content-security-policy: default-src 'self'; script-src 'self';" || { echo "FAIL CSP $path"; exit 1; }
          done
          # robots.txt — настоящий файл, а не SPA-страница
          curl -fsI $B/robots.txt | grep -qi 'content-type: text/plain'
          # API через nginx: данные, валидация, права, сохранение
          curl -fs "$B/api/pets?species=cat" | grep -q '"total"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/applications -H 'content-type: application/json' -d '{}')" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/uploads -H 'content-type: image/png' --data-binary x)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/api/applications -H 'content-type: application/json'             -d '{"petId":"bublik","name":"CI Test","phone":"+7 (900) 000-00-00","email":"ci@example.com","city":"SPb","housing":"house","hasOtherPets":false,"experience":"some","preferredTime":"weekend"}')" = 201
          docker compose exec -T db psql -U dobryi -d dobryi_dom -tAc "select count(*) from applications where email = 'ci@example.com'" | grep -qx 1

      - name: Логи контейнеров
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose logs web api db

      - name: Вход в GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация образа сайта
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Публикация образа API
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: APK_UPGRADE_DATE=${{ env.APK_UPGRADE_DATE }}
          context: .
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
