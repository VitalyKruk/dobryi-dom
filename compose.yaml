services:
  # Продакшн: nginx со статикой — http://localhost:8081 (порт меняется через WEB_PORT)
  web:
    build:
      context: .
      # Меняется раз в день — обновления безопасности Alpine не застревают в кеше Docker
      args:
        APK_UPGRADE_DATE: ${APK_UPGRADE_DATE:-unset}
    image: dobryi-dom:latest
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # API: Node + Express, данные (db.json и фото) — в томе api-data
  api:
    build:
      context: .
      target: api
      args:
        APK_UPGRADE_DATE: ${APK_UPGRADE_DATE:-unset}
    image: dobryi-dom-api:latest
    volumes:
      - api-data:/data
    restart: unless-stopped

  # Разработка с hot reload: Vite + API в одном контейнере — http://localhost:5173
  # Запуск: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      # На Windows/macOS события файловой системы не доходят в контейнер — следим опросом
      - VITE_POLLING=1
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  api-data:
