services:
  # Продакшн: nginx со статикой — http://localhost:8081 (порт меняется через WEB_PORT)
  web:
    build:
      context: .
      # Меняется раз в день — обновления безопасности Alpine не застревают в кеше Docker
      args:
        APK_UPGRADE_DATE: ${APK_UPGRADE_DATE:-unset}
    image: dobryi-dom:latest
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # API: Node + Express, данные (db.json и фото) — в томе api-data
  api:
    build:
      context: .
      target: api
      args:
        APK_UPGRADE_DATE: ${APK_UPGRADE_DATE:-unset}
    image: dobryi-dom-api:latest
    environment:
      # Supabase (если задан в .env): данные — в Postgres, фото — в Storage; иначе — JSON в томе api-data.
      # При первом запуске на пустом Supabase туда переносится всё из тома.
      SUPABASE_URL: ${SUPABASE_DOCKER_URL:-${SUPABASE_URL:-}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - api-data:/data
    restart: unless-stopped

  # Разработка с hot reload: Vite + API в одном контейнере — http://localhost:5173
  # Запуск: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${DEV_PORT:-5173}:5173"
    environment:
      # На Windows/macOS события файловой системы не доходят в контейнер — следим опросом
      - VITE_POLLING=1
      # Dev-API хранит данные в JSON (data/db.json), а не в Supabase: два процесса API на одной
      # базе разошлись бы — у каждого свой кеш в памяти. Supabase использует прод-стек (api).
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  api-data:
