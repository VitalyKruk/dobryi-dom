server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Файлы с хешем в имени не меняются — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Фото из стартовых данных (public/photos): имя — id снимка, содержимое не меняется
    location /photos/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API и загруженные фото — в сервис api. Адрес резолвится при запросе (переменная + resolver),
    # поэтому nginx стартует и без API — например, в smoke-тесте образа.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA: любой неизвестный путь (/pet/persik, /admin/...) отдаём index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
